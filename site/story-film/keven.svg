    <!-- Cropped sides, high forehead and the characteristic brushed-back top. -->
    <path d="M102 96c-3-10-4-22-2-32 2-15 12-27 27-29 6-3 14-4 21-1 15-2 25 5 28 17 3 11 1 25-3 40l-3 8-1-20c-2-7-3-12-9-16-9-6-21-6-31-4-11 2-18 7-21 16l-1 24z" transform="translate(0 8) scale(1 .92)" fill="#252b27" />
    <path d="M104 70c4-15 14-23 28-26m-20 16c6-10 16-14 27-16m-20 10c7-7 17-9 27-8m-18 7c10-5 20-5 29-1m-18 1c9-2 17 0 23 4m-8-12c7 1 13 5 16 11" transform="translate(0 8) scale(1 .92)" fill="none" stroke="#798079" stroke-width="1.6" stroke-linecap="round" opacity=".68" />
    <path d="M101 101q5-3 8 5m-8-1q4 0 5 5m67-9q-4-2-6 5m6-1q-4 1-4 5" fill="none" stroke="#a77f70" stroke-width="1.5" stroke-linecap="round" />
    <!-- A close-trimmed beard follows the jaw, leaving the cheeks and lips clear. -->
    <path d="M107 109c3 8 6 13 10 16 5 5 10 7 20 8 11 0 18-3 23-8 4-4 7-9 10-16-1 12-5 23-13 31-6 7-12 10-20 10-9 0-16-4-22-11-6-8-9-18-8-30z" fill="#705e52" opacity=".55" />
