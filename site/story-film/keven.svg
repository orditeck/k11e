  <symbol id="sf-keven-lip-shade" viewBox="0 0 240 324">
    <path d="M128.5 127.1q4-1.2 8.5-.5 4.5-.7 9 .5-3.5 2.2-8.5 2.5-4.5-.2-9-2.5Z" fill="#b98779" stroke="none" opacity=".22" />
